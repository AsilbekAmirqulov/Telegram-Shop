<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium Shop</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="animated-bg" aria-hidden="true"></div>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="header-icon">💎</div>

            <div>
                <h1>Premium Shop</h1>
                <p>Telegram uchun xizmatlar</p>
            </div>
        </header>


        <!-- User -->
        <div class="user-card">
            <div class="user-avatar" id="userAvatar">
                👤
            </div>

            <div class="user-info">
                <span class="user-label">Xush kelibsiz</span>
                <strong id="userName">
                    Telegram foydalanuvchisi
                </strong>
            </div>
        </div>


        <!-- Section title -->
        <div class="section-header">
            <h2>Mahsulotlar</h2>
            <span>Tanlang</span>
        </div>


        <!-- Categories -->
        <div class="categories">

            <!-- Telegram Premium -->
            <button
                type="button"
                class="category"
                id="premiumButton"
            >
                <div class="category-icon premium-icon">
                    💎
                </div>

                <div class="category-info">
                    <strong>Telegram Premium</strong>
                   <span>1, 3, 6 yoki 12 oy</span>
                </div>

                <div class="category-arrow">
                    ›
                </div>
            </button>


            <!-- Telegram Stars -->
            <button
                type="button"
                class="category"
                id="starsButton"
            >
                <div class="category-icon stars-icon">
                    ⭐
                </div>

                <div class="category-info">
                    <strong>Telegram Stars</strong>
                    <span>Stars sotib olish</span>
                </div>

                <div class="category-arrow">
                    ›
                </div>
            </button>

        </div>


        <!-- Products -->
        <!-- Dastlab yashirin -->
        <div
            id="productsSection"
            style="display: none;"
        >

            <div class="section-header products-title">
                <h2 id="productsTitle">
                    Premium paketlar
                </h2>
            </div>

            <div id="products"></div>

        </div>


        <!-- Footer -->
        <footer class="footer">
            <span>🔒 Xavfsiz to‘lov</span>
            <span>•</span>
            <span>⚡ Tez yetkazib berish</span>
        </footer>

    </div>


    <script src="app.js?v=3"></script>

</body>
</html>
